name: Build C4 Android 3D assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CAD conversion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cadquery trimesh numpy

      - name: Download official Epson C4-A601S STEP package
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://eposs.epson.com.cn/EPSON/assets/resource/Download/Robot/C4-A601S/C4-A601S-step.zip" \
            --output C4-A601S-step.zip
          test -s C4-A601S-step.zip
          unzip -o C4-A601S-step.zip

      - name: Convert standard C4-A601S assembly
        run: |
          rm -rf generated-c4
          mkdir -p generated-c4
          python tools/c4/convert_step_to_glb.py \
            c4-a600s_asm.stp \
            generated-c4
          ls -lh generated-c4

      - name: Copy generated assets into Android app
        run: |
          TARGET="app/src/main/assets/models/robots/c4-a601s"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp generated-c4/*.glb "$TARGET/"
          cp generated-c4/kinematics.json "$TARGET/"

      - name: Upload generated GLB package
        uses: actions/upload-artifact@v4
        with:
          name: C4-A601S-android-glb
          path: generated-c4/
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Android assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models/robots/c4-a601s
          if git diff --cached --quiet; then
            echo "Generated assets unchanged"
          else
            git commit -m "assets: add generated articulated C4-A601S GLBs"
            git push origin HEAD:feature/c4-cad-acquisition
          fi